name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: mvn verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run all tests
        run: mvn -B -ntp verify
